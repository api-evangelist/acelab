aid: acelab
name: Acelab
description: 'Acelab is a Brooklyn, New York software company building Material Hub,
  an AI-assisted material intelligence platform for the architecture, engineering,
  construction and owner (AECO) market. Founded in 2019 by architecture graduates from
  Harvard and MIT, the platform lets architects, designers, owners and manufacturer
  partners research, compare, specify, document and track building products across a
  database of more than 200,000 items, with SpecPlanner, Smart Docs, schedules,
  sustainability conformance and vendor management on top. Its marquee integration is a
  bi-directional Autodesk Revit add-in that syncs materials, families, keynotes and
  schedules between the model and the Material Hub library; ACC360, Procore, SharePoint
  and "custom API" integrations are sold only on the Enterprise tier. Acelab does not
  publish a public developer program: the production platform API answers Bearer-token
  challenges and its Swagger surface is protected by HTTP Basic auth, while the only
  anonymously reachable machine surface is a documentation-search MCP server on the
  docs host.'
