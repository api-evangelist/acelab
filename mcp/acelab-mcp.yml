note: >-
  Acelab operates one anonymously reachable MCP server, on its documentation host. It was found
  from the RFC 8414 / RFC 9728 discovery documents at docs.acelabusa.com and confirmed by an
  unauthenticated initialize + tools/list round trip on 2026-09-06 (HTTP 200, text/event-stream).
  The server reports serverInfo {"name":"Acelab","version":"1.0.0"} and protocolVersion
  2025-06-18. It is provided by the Mintlify documentation platform rather than authored by
  Acelab (x-matched-path /_mintlify/mcp/auth/[subdomain]/[transport]), so the tool set is the
  platform's generic docs-search trio, not an Acelab product API. It is recorded because it is
  real, live, on Acelab's own host, and callable by an agent today. Acelab's actual product API
  is NOT exposed over MCP by Acelab; see unofficial_servers below.
