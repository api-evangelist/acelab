apis:
- name: Acelab Material Hub Platform API
  description: 'The private production API behind the Acelab Material Hub web application
    and Revit add-in. It is not a published developer product: no OpenAPI, no API
    reference and no key-issuance flow is published anywhere on acelabusa.com, and
    "Custom API Integrations" are listed as an Enterprise-tier, sales-gated item on the
    pricing page. The base URL recorded here is the one Acelab''s own Nuxt application
    at app.acelabusa.com calls at runtime; requests to it answer 401 with
    WWW-Authenticate: Bearer, and the ASP.NET Swagger surface at /swagger/v1/swagger.json
    answers 401 with WWW-Authenticate: Basic — the machine-readable contract exists but
    is behind an access control.'
  humanURL: https://www.acelabusa.com/pricing/architect-designers
  baseURL: https://acelab-api-prod-178528813198.us-east4.run.app/api
  tags:
  - Building Materials
  - Product Data
  - Specification
  properties:
  - type: Authentication
    url: authentication/acelab-authentication.yml
- name: Acelab Documentation MCP Server
  description: 'A remote, anonymously reachable Model Context Protocol server serving
    search and retrieval over Acelab''s public documentation and webinar library. It is
    provided by the Mintlify documentation platform on Acelab''s own docs host, advertises
    serverInfo.name "Acelab", and exposes three tools (search_acelab,
    query_docs_filesystem_acelab, submit_feedback). RFC 8414 and RFC 9728 discovery
    documents on the same host describe an optional OAuth authorization server with a
    single mcp:search scope; tools/list succeeds without any credential.'
  humanURL: https://docs.acelabusa.com/help-center
  baseURL: https://docs.acelabusa.com/mcp
  tags:
  - MCP
  - Documentation
  - Search
  properties:
  - type: MCPServer
    url: mcp/acelab-mcp.yml
  - type: OAuthScopes
    url: scopes/acelab-scopes.yml
