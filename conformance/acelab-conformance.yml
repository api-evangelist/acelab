note: >-
  Every entry below was established from a document Acelab's own hosts served on 2026-09-06.
  Nothing is asserted from marketing prose. Acelab publishes no certifications, no trust center
  and no compliance page, so no type: Compliance pointer is emitted. The AECO / building-product
  market does have domain standards a specification platform could declare — IFC, bSDD, BIM
  Collaboration Format, OmniClass/MasterFormat/UniFormat, EPD/ISO 14025 environmental product
  declarations — and Acelab declares NONE of them in any machine-readable contract. That is a
  recorded absence, not a penalty: the platform speaks Revit families and keynotes, and its
  contract is not public.
